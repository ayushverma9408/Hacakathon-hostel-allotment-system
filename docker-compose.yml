services:
  db:
    image: postgres:16-alpine
    container_name: allotmentpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: allotment_dev
      POSTGRES_PASSWORD: allotment_dev
      POSTGRES_DB: hostel_allotment
    ports:
      - "5432:5432"
    volumes:
      - allotmentpro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allotment_dev -d hostel_allotment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  allotmentpro_postgres_data:
