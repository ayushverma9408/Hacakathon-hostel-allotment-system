name: Allocation regression tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  allocation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run allocation regression tests
        run: node --test tests/allocation.test.js
